[project]
name = "evidence-research-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]",
  "sse-starlette",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite",
  "openai>=1.40",
  "pydantic>=2.8",
  "pyyaml",
  "gitpython",
  "httpx",
  "trafilatura",
  "pypdf",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
